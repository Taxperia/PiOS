<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiOS</title><link rel="stylesheet" href="/style.css"><script type="module" src="/ui.js"></script></head>
<body data-phase="boot" data-legacy-portal="false">
<div class="wallpaper" aria-hidden="true"><div class="ribbon ribbon-one"></div><div class="ribbon ribbon-two"></div><div class="ribbon ribbon-three"></div></div>
<section id="boot" aria-labelledby="boot-title" aria-live="polite"><div class="boot-content"><div class="brand-mark" aria-hidden="true">P<span>i</span></div><h1 id="boot-title">PiOS</h1><div class="spinner" aria-hidden="true"></div><p id="boot-status" data-i18n="starting">Starting PiOS…</p><button id="retry-start" hidden data-i18n="retry">Try again</button></div></section>
<header id="portal-header"><strong>PiOS<span class="brand-dot"></span></strong><span id="connection" role="status"></span><select id="language" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select><button id="logout" hidden data-i18n="logout">Sign out</button></header>
<main>
<section id="login" class="card" hidden aria-labelledby="login-title"><div class="login-clock"><time class="clock"></time><span id="calendar-date"></span></div><div class="avatar" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="17" r="8"/><path d="M9 41v-4a15 15 0 0 1 30 0v4"/></svg></div><div class="eyebrow" data-i18n="local">YOUR LOCAL DESKTOP</div><h1 id="login-title">Welcome to PiOS</h1><p id="login-help"></p><form id="login-form"><label id="username-label"><span data-i18n="username">Username</span><input id="login-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="31"></label><label><span data-i18n="password">Password</span><input id="login-password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="sign-in" type="submit" class="primary" data-i18n="signin">Continue</button></form><p class="login-footnote" data-i18n="localConnection">A little space. All yours.</p></section>
<section id="desktop" hidden aria-label="PiOS desktop"><div id="screen"></div><section id="connection-panel" hidden aria-label="Connection recovery"><p id="desktop-status" role="status"></p><div class="row"><button id="reconnect" data-i18n="reconnect">Reconnect</button><button id="connection-report" data-i18n="connectionReport" hidden>Download connection report</button><button id="desktop-logout" data-i18n="logout">Sign out</button></div></section></section>
<section id="done" class="card" hidden><div class="complete-mark" aria-hidden="true">✓</div><div class="eyebrow">PiOS</div><h1 data-i18n="complete">Setup complete</h1><p data-i18n="restart">The device will restart. Reconnect to its network and open this address again. If you enabled browser access, sign in with your new local account.</p></section>
<p id="error" role="alert" hidden></p>
</main><noscript>Enable JavaScript to use the local setup and browser desktop.</noscript>
</body></html>
