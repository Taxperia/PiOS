<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.fidan.FirstBoot1"/>
  </policy>
  <policy user="fidan-setup">
    <allow send_destination="org.fidan.FirstBoot1"/>
  </policy>
  <policy context="default">
    <deny own="org.fidan.FirstBoot1"/>
    <deny send_destination="org.fidan.FirstBoot1"/>
  </policy>
</busconfig>

