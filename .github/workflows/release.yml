name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates gnupg git build-essential devscripts debhelper cmake ninja-build python3 qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools liblayershellqtinterface-dev libxkbcommon-dev dbus-x11 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript libqt6svg6 qt6-image-formats-plugins papirus-icon-theme fonts-inter
      - uses: actions/checkout@v4
      - name: Build and test Debian packages
        env:
          DEB_BUILD_OPTIONS: parallel=2
        run: ./scripts/build-debs
      - name: Check package dependencies on Debian 13
        run: |
          apt-get update
          apt-get --simulate install ./dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            !dist/*-dbgsym_*.deb
          retention-days: 7

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Prepare and sign release
        env:
          FIDAN_RELEASE_GPG_KEY: ${{ secrets.FIDAN_RELEASE_GPG_KEY }}
        run: |
          test -n "$FIDAN_RELEASE_GPG_KEY"
          ./scripts/prepare-release
          ./scripts/sign-update-release
      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("config/product.json"))["version"])')"
          if [ "${RELEASE_REF#refs/tags/}" != "$tag" ] && [ "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF" ]; then
            echo 'Tag does not match product version' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "PiOS $tag" --notes-file docs/releases/current.md
          fi
          gh release upload "$tag" release/* --clobber
          case "$tag" in
            *-*) gh release edit "$tag" --draft=false --prerelease ;;
            *) gh release edit "$tag" --draft=false ;;
          esac
